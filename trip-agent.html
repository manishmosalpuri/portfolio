<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack AI — Guidesly Listing Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0d0d0d;--ink-2:#2a2a2a;--ink-3:#6b6b6b;--ink-4:#a0a0a0;
  --bg:#f5f4f0;--card:#fff;--rule:#e8e7e3;
  --accent:#1a56db;--accent-light:#eef3ff;
  --green:#0a6640;--green-light:#e3f5ec;
  --amber:#b45309;--amber-light:#fef3c7;
  --tool-bg:#f0fdf4;--tool-border:#a3d9b8;
  --radius:14px;--radius-sm:8px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

.header{background:var(--card);border-bottom:1px solid var(--rule);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:800;letter-spacing:-0.02em}
.logo span{color:var(--accent)}
.agent-name{font-size:13px;font-weight:600;color:var(--ink-2)}
.agent-status{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);font-weight:600}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.agentic-badge{display:inline-flex;align-items:center;gap:5px;background:var(--green-light);border:1px solid var(--tool-border);color:var(--green);font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px}
.step-progress{font-size:11px;color:var(--ink-4);font-weight:500}

.progress-track{height:3px;background:var(--rule);flex-shrink:0}
.progress-fill{height:100%;background:var(--accent);transition:width 0.6s ease;width:0%}

.chat{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}

.msg{display:flex;gap:10px;align-items:flex-end;max-width:100%}
.msg.agent{align-self:flex-start;max-width:88%}
.msg.user{align-self:flex-end;flex-direction:row-reverse;max-width:75%}
.msg.tool-msg{align-self:flex-start;max-width:92%}
.msg.full-width{align-self:flex-start;width:100%;max-width:100%}

.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-bottom:2px}
.avatar.user-av{background:var(--ink-2)}
.avatar.tool-av{background:var(--green);font-size:12px}

.bubble{padding:11px 15px;border-radius:var(--radius);font-size:13.5px;line-height:1.65;word-wrap:break-word}
.agent .bubble{background:var(--card);border:1px solid var(--rule);color:var(--ink-2);border-bottom-left-radius:4px}
.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}

/* TOOL CARD */
.tool-card{background:var(--tool-bg);border:1px solid var(--tool-border);border-radius:var(--radius);overflow:hidden;width:100%}
.tool-card-header{padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--green);border-bottom:1px solid var(--tool-border)}
.tool-name{flex:1}
.tool-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.tool-status.calling{background:var(--amber-light);color:var(--amber)}
.tool-status.done{background:var(--green-light);color:var(--green)}
.tool-input{padding:6px 14px;font-size:11px;color:var(--ink-3);border-bottom:1px solid var(--tool-border);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-output{padding:10px 14px;font-size:12px;color:var(--ink-2);line-height:1.6}
.tool-output pre{font-family:monospace;font-size:10.5px;color:var(--ink-3);white-space:pre-wrap;background:rgba(0,0,0,0.03);padding:8px;border-radius:6px;max-height:120px;overflow:auto}

/* QUICK REPLIES */
.quick-replies{display:flex;flex-wrap:wrap;gap:7px;padding:4px 0 0 40px}
.qr{font-size:12px;font-weight:600;padding:7px 14px;border:1.5px solid var(--accent);border-radius:20px;cursor:pointer;background:#fff;color:var(--accent);transition:all 0.15s}
.qr:hover{background:var(--accent);color:#fff}

/* INPUT */
.input-bar{background:var(--card);border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
.input-wrap{flex:1;background:var(--bg);border:1.5px solid var(--rule);border-radius:22px;padding:9px 16px;display:flex;align-items:center;transition:border 0.15s}
.input-wrap:focus-within{border-color:var(--accent);background:#fff}
textarea.chat-input{flex:1;border:none;background:transparent;font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);resize:none;outline:none;max-height:100px;min-height:22px;height:22px;line-height:1.5}
textarea.chat-input::placeholder{color:var(--ink-4)}
.send-btn{width:38px;height:38px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all 0.15s}
.send-btn:hover{background:#1347c0}
.send-btn:disabled{opacity:0.4;cursor:not-allowed}

/* SUCCESS BANNER */
.success-banner{background:var(--green-light);border:1px solid var(--tool-border);border-radius:var(--radius);padding:16px 20px;margin-top:8px}
.success-title{font-size:14px;font-weight:700;color:var(--green);margin-bottom:4px}
.success-url{font-size:12px;color:var(--green);font-family:monospace;margin-bottom:12px}
.view-listing-btn{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;font-size:13px;font-weight:700;padding:10px 20px;border-radius:8px;text-decoration:none;transition:background 0.15s}
.view-listing-btn:hover{background:#085533}
</style>
</head>
<body>

<div class="header">
  <div class="avatar" style="width:32px;height:32px;font-size:16px">🧭</div>
  <div>
    <div class="agent-name">Jack AI — Listing Agent</div>
    <div class="agent-status"><div class="status-dot"></div> Online</div>
  </div>
  <div class="header-right">
    <div class="agentic-badge">⚡ Agentic</div>
    <div class="logo">guide<span>sly</span></div>
    <div class="step-progress" id="stepProgress"></div>
  </div>
</div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="chat" id="chat"></div>
<div class="input-bar">
  <div class="input-wrap">
    <textarea class="chat-input" id="userInput" placeholder="Tell Jack AI about your trip or experience..." rows="1"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────────
var state = {
  phase: 'collect',
  history: [],
  tools: {},      // tool call results keyed by tool name
  listing: {},    // final generated listing data
  collected: {}   // which fields have been answered
};

// ─── ACTIVITY HELPERS ─────────────────────────────────────────
function detectActivity(text) {
  text = text.toLowerCase();
  if (/fish|bass|trout|salmon|redfish|tuna|walleye|angl|fly.fish|offshore|inshore/.test(text)) return 'fishing';
  if (/scuba|div(e|ing)|snorkel/.test(text)) return 'scuba';
  if (/hunt|elk|deer|duck|turkey|quail|boar/.test(text)) return 'hunting';
  if (/cruise|boat.tour|sunset.sail|sail|yacht|charter/.test(text)) return 'cruise';
  if (/kayak|paddle|canoe|sup|paddleboard/.test(text)) return 'paddle';
  if (/ski|snow|board|snowshoe|backcountry/.test(text)) return 'snow';
  if (/surf|wave/.test(text)) return 'surf';
  if (/hike|trail|climb|trek|backpack/.test(text)) return 'hike';
  if (/whale|dolphin|wild|safari|bird/.test(text)) return 'wildlife';
  return 'general';
}

function activityEmoji(type) {
  var m = {fishing:'🎣',scuba:'🤿',hunting:'🏹',cruise:'🚢',paddle:'🛶',snow:'🎿',surf:'🏄',hike:'🥾',wildlife:'🦁',general:'🧭'};
  return m[type] || '🧭';
}

function activityLabel(type) {
  var m = {fishing:'Fishing',scuba:'Scuba & Water Sports',hunting:'Hunting',cruise:'Boat Tours & Cruises',paddle:'Kayaking & Paddling',snow:'Snow Sports',surf:'Surfing',hike:'Hiking & Climbing',wildlife:'Wildlife & Nature',general:'Outdoor Adventure'};
  return m[type] || 'Outdoor Experience';
}

function getHeroGradient(type) {
  var m = {
    fishing:'linear-gradient(160deg,#1a3a5c 0%,#0d2137 40%,#1a4a2e 100%)',
    scuba:'linear-gradient(160deg,#0d3366 0%,#082a5c 40%,#0d4a6a 100%)',
    hunting:'linear-gradient(160deg,#2d3a1a 0%,#1a2a0d 40%,#3a2a0d 100%)',
    cruise:'linear-gradient(160deg,#1a3a5c 0%,#0d2137 40%,#1a3a5c 100%)',
    paddle:'linear-gradient(160deg,#0d3a5c 0%,#0d2a3a 40%,#1a4a2e 100%)',
    snow:'linear-gradient(160deg,#2a3a5c 0%,#1a2a4a 40%,#3a4a6a 100%)',
    surf:'linear-gradient(160deg,#1a4a6a 0%,#0d3a5c 40%,#1a5a4a 100%)',
    hike:'linear-gradient(160deg,#2a3a1a 0%,#1a2a0d 40%,#3a2a1a 100%)',
    wildlife:'linear-gradient(160deg,#3a2a0d 0%,#2a1a0d 40%,#1a3a1a 100%)',
    general:'linear-gradient(160deg,#1a3a5c 0%,#0d2137 40%,#1a4a2e 100%)'
  };
  return m[type] || m.general;
}

// ─── TOOLS DEFINITION ─────────────────────────────────────────
var TOOLS = [
  {
    name: 'search_comparable_trips',
    description: 'Search Guidesly marketplace for comparable trips by activity, location, and duration. Returns pricing benchmarks and what top listings include.',
    input_schema: {
      type: 'object',
      properties: {
        activity_type: {type:'string'},
        location: {type:'string'},
        duration_hours: {type:'number'}
      },
      required: ['activity_type','location']
    }
  },
  {
    name: 'get_taxonomy_categories',
    description: 'Get official Guidesly taxonomy categories and SEO tags for the activity type.',
    input_schema: {
      type: 'object',
      properties: {
        activity_type: {type:'string'},
        sub_type: {type:'string'}
      },
      required: ['activity_type']
    }
  },
  {
    name: 'get_location_regulations',
    description: 'Get licence requirements, permits, and regulations for the activity and location. Used to generate accurate FAQs.',
    input_schema: {
      type: 'object',
      properties: {
        activity_type: {type:'string'},
        state_or_region: {type:'string'},
        country: {type:'string'}
      },
      required: ['activity_type','state_or_region']
    }
  },
  {
    name: 'validate_listing_quality',
    description: 'Run quality checks on the draft listing. Returns a score, pass/fail on required fields, and improvement suggestions.',
    input_schema: {
      type: 'object',
      properties: {
        title: {type:'string'},
        description: {type:'string'},
        price: {type:'number'},
        faq_count: {type:'number'},
        has_start_times: {type:'boolean'},
        has_vessel_info: {type:'boolean'}
      },
      required: ['title','description']
    }
  },
  {
    name: 'publish_listing',
    description: 'Publish the approved listing to Guidesly marketplace. Creates a live SEO-optimised trip landing page. Requires guide_approved: true.',
    input_schema: {
      type: 'object',
      properties: {
        title: {type:'string'},
        description: {type:'string'},
        activity_type: {type:'string'},
        location: {type:'string'},
        duration: {type:'string'},
        start_times: {type:'array', items:{type:'string'}},
        group_size: {type:'string'},
        price: {type:'number'},
        price_per: {type:'string'},
        categories: {type:'array', items:{type:'string'}},
        included: {type:'array', items:{type:'string'}},
        not_included: {type:'array', items:{type:'string'}},
        vessel_name: {type:'string'},
        vessel_specs: {type:'array', items:{type:'string'}},
        target: {type:'string'},
        guide_bio: {type:'string'},
        faqs: {type:'array'},
        guide_approved: {type:'boolean'}
      },
      required: ['title','description','guide_approved']
    }
  }
];

// ─── TOOL EXECUTION (simulated platform APIs) ─────────────────
function runTool(name, input) {
  var act = (input.activity_type || '').toLowerCase();
  var loc = input.location || input.state_or_region || '';

  if (name === 'search_comparable_trips') {
    var base = act.includes('scuba') ? 130 : act.includes('hunt') ? 380 : act.includes('cruise') ? 90 : act.includes('ski') || act.includes('snow') ? 210 : 100;
    var result = {
      comparable_trips: 14,
      price_per_trip: {min: base*3, avg: Math.round(base*4.2), max: base*6},
      price_per_person: {min: Math.round(base*0.8), avg: Math.round(base*1.1), max: Math.round(base*1.6)},
      top_listing_features: ['Multiple start times shown','Vessel/equipment details','4+ FAQs including licence info','Included/not-included checklist','AI-generated trip summary'],
      avg_description_words: 185,
      market_insight: 'Listings with multiple start times get 35% more bookings. Morning slots convert best.'
    };
    state.tools.pricing = result;
    return result;
  }

  if (name === 'get_taxonomy_categories') {
    var primary = act.includes('bass') ? 'Bass Fishing' : act.includes('fly') ? 'Fly Fishing' : act.includes('offshore') ? 'Offshore Fishing' : act.includes('inshore') ? 'Inshore Fishing' : act.includes('scuba') ? 'Scuba Diving' : act.includes('snorkel') ? 'Snorkelling' : act.includes('elk') || act.includes('deer') ? 'Guided Hunting' : act.includes('duck') ? 'Waterfowl Hunting' : act.includes('cruise') || act.includes('sail') ? 'Boat Tours & Cruises' : act.includes('kayak') ? 'Kayaking' : act.includes('ski') || act.includes('snow') ? 'Snow Sports' : act.includes('surf') ? 'Surfing' : act.includes('hike') || act.includes('trek') ? 'Guided Hiking' : 'Outdoor Adventure';
    var tags = [primary, 'Expert Guide', 'Small Groups', 'All Levels Welcome', 'Equipment Provided', 'Unforgettable Experience', 'Book Online'];
    var result = {primary_category: primary, tags: tags, seo_slug_prefix: primary.toLowerCase().replace(/\s+/g,'-')};
    state.tools.taxonomy = result;
    return result;
  }

  if (name === 'get_location_regulations') {
    var licType = act.includes('fish') ? loc + ' Fishing Licence' : act.includes('hunt') ? loc + ' Hunting Licence & Tag' : act.includes('scuba') ? 'Open Water Certification (PADI/NAUI)' : 'No licence required';
    var result = {
      licence_required: !act.includes('cruise') && !act.includes('kayak') && !act.includes('ski'),
      licence_type: licType,
      licence_cost: act.includes('fish') ? '$11-25/day or $47/year' : act.includes('hunt') ? '$40-180 depending on species' : act.includes('scuba') ? 'Free — bring your certification card' : 'N/A',
      where_to_get: 'Online at official state website or at local sporting goods stores',
      min_age: '17+',
      cancellation_policy: 'Free cancellation up to 48 hours before the trip. 50% refund within 48 hours.',
      special_note: act.includes('scuba') ? 'Participants must hold a minimum Open Water certification. Discover Scuba available for uncertified guests.' : act.includes('hunt') ? 'Hunter safety course may be required for first-time hunters in some states.' : ''
    };
    state.tools.regulations = result;
    return result;
  }

  if (name === 'validate_listing_quality') {
    var titleLen = (input.title || '').length;
    var descWords = (input.description || '').split(' ').length;
    var score = 0;
    if (titleLen >= 30 && titleLen <= 70) score += 22; else score += 12;
    if (descWords >= 150) score += 25; else score += 12;
    if (input.price > 0) score += 18;
    if (input.faq_count >= 4) score += 18; else score += 8;
    if (input.has_start_times) score += 10;
    if (input.has_vessel_info) score += 7;
    var result = {
      score: score,
      status: score >= 80 ? 'READY TO PUBLISH' : 'REVIEW RECOMMENDED',
      checks: [
        {field:'Title', pass: titleLen >= 30 && titleLen <= 70, note: titleLen + ' chars — ' + (titleLen < 30 ? 'add more detail' : titleLen > 70 ? 'slightly long' : 'optimal')},
        {field:'Description', pass: descWords >= 150, note: descWords + ' words — ' + (descWords < 150 ? 'add more detail' : 'good depth')},
        {field:'Pricing', pass: input.price > 0, note: input.price > 0 ? 'Price set' : 'No price set'},
        {field:'FAQs', pass: input.faq_count >= 4, note: (input.faq_count || 0) + ' FAQs'},
        {field:'Start Times', pass: !!input.has_start_times, note: input.has_start_times ? 'Set — increases bookings 35%' : 'Missing — strongly recommended'},
        {field:'Photos', pass: false, note: 'Upload after publish — increases conversion 40%'}
      ]
    };
    state.tools.validation = result;
    return result;
  }

  if (name === 'publish_listing') {
    if (!input.guide_approved) return {success: false, error: 'Guide approval required'};
    var slug = (input.title || 'trip').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50);
    var id = 'LST-' + Math.random().toString(36).substr(2,8).toUpperCase();
    var result = {
      success: true, listing_id: id,
      url: 'https://guidesly.com/trips/' + slug,
      slug: slug, status: 'LIVE',
      seo_indexed: true,
      message: 'Trip listing is live.'
    };
    // Store full listing for landing page render
    state.listing = Object.assign({}, input, result);
    return result;
  }

  return {error: 'Unknown tool'};
}

// ─── API CALL ──────────────────────────────────────────────────
async function callJackAI(extraSystemNote) {
  // Build collected fields summary from conversation
  var userText = state.history.filter(function(m){return m.role==='user' && typeof m.content==='string';}).map(function(m){return m.content;}).join(' ').toLowerCase();
  var c = state.collected;
  if (/\d+.?(hour|hr|day|minute|min|half.day|full.day)/i.test(userText)) c.duration = true;
  if (/\d{1,2}(:\d{2})?\s?(am|pm)/i.test(userText) || /morning|afternoon|evening|start time/i.test(userText)) c.startTimes = true;
  if (/\d+.?(guest|people|person|max|capacity)/i.test(userText) || /up to \d|group of \d/i.test(userText)) c.groupSize = true;
  if (/equipment|gear|tackle|rod|reel|bcd|tank|wetsuit|provide|include/i.test(userText)) c.equipment = true;
  if (/\$\d+|\d+.?dollar|per (trip|person|day|head)|price|cost|charge|market rate/i.test(userText)) c.price = true;
  if (/year|specializ|expert|patent|family|beginner|born|raised|guide since|known for/i.test(userText)) c.special = true;
  if (/boat|vessel|kayak|canoe|raft|ship|yacht|ranger|grady|bass boat|center console|catamaran|zodiac|no boat|bank fish/i.test(userText)) c.vessel = true;
  if (/includ|provid|gear provid|tackle includ|equipment includ/i.test(userText)) c.included = true;

  var collectedList = Object.keys(c).filter(function(k){return c[k];});
  var fieldNames = {duration:'trip duration',startTimes:'available start times',groupSize:'group size / max guests',equipment:'equipment provided',price:'pricing',special:'what makes the guide special',vessel:'vessel/boat details',included:'what is included'};
  var allFields = Object.keys(fieldNames);
  var missingList = allFields.filter(function(k){return !c[k];});

  var collectedStr = collectedList.length ? collectedList.map(function(k){return fieldNames[k]||k;}).join(', ') : 'Nothing yet';
  var missingStr = missingList.length ? missingList.map(function(k){return fieldNames[k]||k;}).join(', ') : 'ALL FIELDS COLLECTED';

  var actType = detectActivity(userText);
  var actLabel = activityLabel(actType);

  var system = 'You are Jack AI, Guidesly\'s agentic listing assistant. Help guides create complete listings for ANY outdoor activity through natural conversation.\n\n' +
    'DETECTED ACTIVITY: ' + actLabel + '\n\n' +
    'ALREADY COLLECTED (NEVER ASK AGAIN): ' + collectedStr + '\n' +
    'STILL NEEDED (ask ONE at a time): ' + missingStr + '\n\n' +
    'PHASE 1 — COLLECT: Ask naturally, one question at a time, adapted to the activity type. When missingStr says ALL FIELDS COLLECTED, move to Phase 2 immediately.\n\n' +
    'PHASE 2 — GENERATE (when all collected): Call tools in order:\n' +
    '1. search_comparable_trips\n2. get_taxonomy_categories\n3. get_location_regulations\n4. validate_listing_quality (with has_start_times and has_vessel_info set)\n5. Present complete listing with TITLE, DESCRIPTION, PRICE, START TIMES, INCLUDED, NOT INCLUDED, VESSEL DETAILS, CATEGORIES, FAQS\n6. Only call publish_listing after guide approves.\n\n' +
    'RULES:\n- Never ask about a collected field\n- Adapt language to the activity (no "fishing licence" for ski trips)\n- Keep messages short — 1-2 sentences\n- For vessel: collect name and key specs (size, motor, capacity, equipment on board)\n- For start times: collect all available times (e.g. 6am, 11am, 3pm)\n- For included/not included: generate a clear checklist\n' +
    (extraSystemNote ? '\n' + extraSystemNote : '');

  var response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: system,
      tools: TOOLS,
      messages: state.history
    })
  });
  return await response.json();
}

// ─── AGENTIC LOOP ──────────────────────────────────────────────
async function agenticLoop(userMessage) {
  if (userMessage !== null) {
    state.history.push({role:'user', content: userMessage});
  }

  var data = await callJackAI();
  var content = data.content || [];
  var assistantContent = [];
  var toolUsed = false;

  for (var i = 0; i < content.length; i++) {
    var block = content[i];

    if (block.type === 'text' && block.text && block.text.trim()) {
      assistantContent.push(block);
      addAgentBubble(block.text);
    }

    if (block.type === 'tool_use') {
      assistantContent.push(block);
      toolUsed = true;
      var toolId = block.id;
      var toolName = block.name;
      var toolInput = block.input;

      // Show tool card
      showToolCard(toolName, toolInput);
      updateProgress(toolName);

      // Execute
      await sleep(400);
      var result = runTool(toolName, toolInput);
      completeToolCard(result);

      // If publish succeeded — render landing page
      if (toolName === 'publish_listing' && result.success) {
        state.history.push({role:'assistant', content: assistantContent});
        state.history.push({role:'user', content: [{type:'tool_result', tool_use_id: toolId, content: JSON.stringify(result)}]});
        await sleep(300);
        renderPublishedLandingPage();
        setProgress(100, '✓ Published!');
        document.getElementById('progressFill').style.background = 'var(--green)';
        await sleep(200);
        // Continue for final message
        return agenticLoop(null);
      }

      // Continue loop with tool result
      state.history.push({role:'assistant', content: assistantContent});
      state.history.push({role:'user', content: [{type:'tool_result', tool_use_id: toolId, content: JSON.stringify(result)}]});
      assistantContent = [];
      await sleep(500);
      return agenticLoop(null);
    }
  }

  if (!toolUsed && assistantContent.length > 0) {
    state.history.push({role:'assistant', content: assistantContent});
  }

  // Generate contextual quick replies
  var lastText = assistantContent.filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');
  if (lastText && lastText.length > 20) {
    await generateReplies(lastText);
  }
}

  var actType = detectActivity((L.activity_type || '') + ' ' + (L.title || ''));
  var emoji = activityEmoji(actType);
  var heroGrad = getHeroGradient(actType);
  var actLbl = activityLabel(actType);
  var tax = state.tools.taxonomy || {};
  var reg = state.tools.regulations || {};
  var val = state.tools.validation || {};
  var pricing = state.tools.pricing || {};

  var price = L.price || (pricing.price_per_trip ? pricing.price_per_trip.avg : 0);
  var pricePer = L.price_per || 'per trip';
  var slug = L.slug || 'my-trip';
  var listingId = L.listing_id || '';

  // Tags
  var tags = (tax.tags || L.categories || []).slice(0,6);
  var tagHtml = tags.map(function(t){
    return '<span style="display:inline-block;background:#eef3ff;color:#1a56db;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;margin:2px">' + esc(t) + '</span>';

  var timeIcons = ['🌅','🌄','☀️','🌇','🌃'];
  var timeLabels = ['Early Morning','Morning','Midday','Afternoon','Evening'];
  var timeSlotsHtml = times.length > 0 ? times.map(function(t, i) {
    var isFirst = i === 0;
    return '<div style="padding:10px 12px;border:' + (isFirst ? '1.5px solid #1a56db;background:#eef3ff' : '1px solid #e8e8e5;background:#fff') + ';border-radius:8px;cursor:pointer;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">' +
      '<div><div style="font-size:12.5px;font-weight:600;color:#0d0d0d">' + (timeIcons[i]||'🕐') + ' ' + esc(t) + ' — ' + (timeLabels[i]||'') + '</div></div>' +
      '<div style="font-size:11px;color:#0a6640;font-weight:600">Available</div>' +
    '</div>';
  }).join('') : '<div style="padding:10px 12px;border:1px solid #e8e8e5;border-radius:8px;font-size:12.5px;color:#999">Contact guide for available times</div>';

  // Included checklist
  var included = L.included || ['Expert guide & instruction','Safety equipment','All activity gear'];

// ─── UI HELPERS ────────────────────────────────────────────────
function scrollDown() { setTimeout(function(){var c=document.getElementById('chat');c.scrollTop=c.scrollHeight;},60); }

function setProgress(pct, label) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('stepProgress').textContent = label;
}

function updateProgress(toolName) {
  var m = {search_comparable_trips:[25,'🔍 Market data...'],get_taxonomy_categories:[45,'🏷️ Categories...'],get_location_regulations:[62,'📋 Regulations...'],validate_listing_quality:[82,'✅ Validating...'],publish_listing:[95,'🚀 Publishing...']};
  var p = m[toolName] || [50,'Processing...'];
  setProgress(p[0], p[1]);
}

var currentToolCard = null;
function showToolCard(toolName, toolInput) {
  var icons = {search_comparable_trips:'🔍',get_taxonomy_categories:'🏷️',get_location_regulations:'📋',validate_listing_quality:'✅',publish_listing:'🚀'};
  var labels = {search_comparable_trips:'Search Comparable Trips',get_taxonomy_categories:'Get Taxonomy Categories',get_location_regulations:'Get Location Regulations',validate_listing_quality:'Validate Listing Quality',publish_listing:'Publish Listing'};
  var div = document.createElement('div');
  div.className = 'msg tool-msg';
  var inputStr = JSON.stringify(toolInput).replace(/"/g,'').slice(0,80) + '...';
  div.innerHTML = '<div class="avatar tool-av">⚡</div><div style="flex:1;min-width:0">' +
    '<div class="tool-card">' +
      '<div class="tool-card-header"><span>' + (icons[toolName]||'🔧') + '</span><span class="tool-name">' + (labels[toolName]||toolName) + '</span><span class="tool-status calling" id="tcStatus">Calling...</span></div>' +
      '<div class="tool-input">' + esc(inputStr) + '</div>' +
      '<div class="tool-output" id="tcOutput"><em style="color:#aaa">Waiting...</em></div>' +
    '</div></div>';
  document.getElementById('chat').appendChild(div);
  currentToolCard = div;
  scrollDown();
}

function completeToolCard(result) {
  if (!currentToolCard) return;
  var s = currentToolCard.querySelector('#tcStatus');
  var o = currentToolCard.querySelector('#tcOutput');
  if (s) { s.className = 'tool-status done'; s.textContent = 'Done'; }
  if (o) {
    var preview = JSON.stringify(result, null, 2).slice(0, 300);
    o.innerHTML = '<pre>' + esc(preview) + (JSON.stringify(result).length > 300 ? '\n...' : '') + '</pre>';
  }
  scrollDown();
}

function addAgentBubble(text) {
  var html = text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
  var div = document.createElement('div');
  div.className = 'msg agent';
  div.innerHTML = '<div class="avatar">🤖</div><div class="bubble">' + html + '</div>';
  document.getElementById('chat').appendChild(div);
  scrollDown();
}

function addUserBubble(text) {
  var div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = '<div class="avatar user-av">👤</div><div class="bubble">' + esc(text) + '</div>';
  document.getElementById('chat').appendChild(div);
  scrollDown();
}

function addQuickReplies(options) {
  document.getElementById('qr')&&document.getElementById('qr').remove();
  var div = document.createElement('div');
  div.className = 'quick-replies';
  div.id = 'qr';
  options.forEach(function(opt) {
    var btn = document.createElement('button');
    btn.className = 'qr';
    btn.textContent = opt;
    btn.onclick = function() {
      document.getElementById('qr')&&document.getElementById('qr').remove();
      document.getElementById('userInput').value = opt;
      sendMessage();
    };
    div.appendChild(btn);
  });
  document.getElementById('chat').appendChild(div);
  scrollDown();
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function sleep(ms) { return new Promise(function(r){setTimeout(r,ms);}); }

// ─── LLM QUICK REPLIES ─────────────────────────────────────────
async function generateReplies(lastMsg) {
  if (!lastMsg || lastMsg.length < 20) return;
  if (/listing_id|is now live|published/i.test(lastMsg)) {
    addQuickReplies(['Create another listing','Done for now']);
    return;
  }
  if (/title:|description:|ready to publish|looks good|review your listing/i.test(lastMsg)) {
    addQuickReplies(['🚀 Yes, publish it!','✏️ Edit the description','💰 Adjust the price','Add more details']);
    return;
  }
  try {
    var recentCtx = state.history.slice(-6).map(function(m) {
      var t = typeof m.content === 'string' ? m.content : (Array.isArray(m.content) ? m.content.filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join(' ') : '');
      return m.role.toUpperCase() + ': ' + t.slice(0,120);
    }).join('\n');

    var resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:120,
        system:'Generate 2-4 short quick reply options for a trip listing conversation. Output ONLY a valid JSON array of strings, max 6 words each. Options must directly answer the specific question asked. Consider what activity type was already mentioned — never suggest unrelated activities. Example: ["6 hours","Full day (8 hours)"]',
        messages:[{role:'user',content:'Recent conversation:\n' + recentCtx + '\n\nAgent just asked: "' + lastMsg.slice(0,200) + '"\n\nGenerate 2-4 reply options as JSON array:'}]
      })
    });
    var d = await resp.json();
    var raw = (d.content&&d.content[0]&&d.content[0].text)||'';
    var match = raw.match(/\[[\s\S]*?\]/);
    if (match) {
      var opts = JSON.parse(match[0]);
      if (Array.isArray(opts) && opts.length > 0) addQuickReplies(opts.slice(0,4));
    }
  } catch(e) { /* silent fail */ }
}

// ─── SEND ──────────────────────────────────────────────────────
async function sendMessage() {
  var input = document.getElementById('userInput');
  var sendBtn = document.getElementById('sendBtn');
  var text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  document.getElementById('qr')&&document.getElementById('qr').remove();
  addUserBubble(text);
  input.value = '';
  input.style.height = '22px';
  sendBtn.disabled = true;
  try { await agenticLoop(text); } catch(e) { console.error(e); addAgentBubble('Something went wrong. Please try again.'); }
  sendBtn.disabled = false;
}

document.getElementById('userInput').addEventListener('input', function() {
  this.style.height = '22px';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});
document.getElementById('userInput').addEventListener('keydown', function(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

};
