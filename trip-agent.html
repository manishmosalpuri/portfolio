<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack AI — Guidesly Listing Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#0d0d0d;--ink-2:#2a2a2a;--ink-3:#6b6b6b;--ink-4:#a0a0a0;
    --bg:#f5f4f0;--card:#ffffff;--rule:#e8e7e3;
    --accent:#1a56db;--accent-light:#eef3ff;
    --green:#0a6640;--green-light:#e3f5ec;
    --agent-bg:#f0f4ff;--agent-border:#d0deff;
    --user-bg:#1a56db;
    --radius:14px;--radius-sm:8px;
  }
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

  /* HEADER */
  .header{background:var(--card);border-bottom:1px solid var(--rule);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .logo{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:800;letter-spacing:-0.02em;color:var(--ink)}
  .logo span{color:var(--accent)}
  .agent-name{font-size:13px;font-weight:600;color:var(--ink-2)}
  .agent-status{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);font-weight:600}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .step-progress{font-size:11px;color:var(--ink-4);font-weight:500}

  /* PROGRESS BAR */
  .progress-track{height:3px;background:var(--rule);flex-shrink:0}
  .progress-fill{height:100%;background:var(--accent);transition:width 0.6s ease;width:0%}

  /* CHAT AREA */
  .chat{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .chat::-webkit-scrollbar{width:4px}
  .chat::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}

  /* MESSAGES */
  .msg{display:flex;gap:10px;align-items:flex-end;max-width:100%}
  .msg.agent{align-self:flex-start;max-width:85%}
  .msg.user{align-self:flex-end;flex-direction:row-reverse;max-width:75%}

  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-bottom:2px}
  .avatar.user-av{background:var(--ink-2)}

  .bubble{padding:11px 15px;border-radius:var(--radius);font-size:13.5px;line-height:1.65;word-wrap:break-word}
  .agent .bubble{background:var(--card);border:1px solid var(--rule);color:var(--ink-2);border-bottom-left-radius:4px}
  .user .bubble{background:var(--user-bg);color:#fff;border-bottom-right-radius:4px}

  /* SPECIAL CARDS IN CHAT */
  .result-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;margin-top:4px;width:100%}
  .result-card-header{padding:10px 14px;background:var(--agent-bg);border-bottom:1px solid var(--agent-border);display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent)}
  .result-card-body{padding:13px 15px;font-size:13px;color:var(--ink-2);line-height:1.7}
  .result-card-body strong{color:var(--ink);font-weight:600}

  .tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--accent-light);color:var(--accent)}

  .faq-item{padding:8px 0;border-bottom:1px solid var(--rule)}
  .faq-item:last-child{border-bottom:none}
  .faq-q{font-weight:600;color:var(--ink);font-size:13px;margin-bottom:3px}
  .faq-a{color:var(--ink-3);font-size:12.5px;line-height:1.55}

  .val-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
  .val-row:last-child{border-bottom:none}

  /* PREVIEW LISTING */
  .listing-preview{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
  .listing-hero{background:linear-gradient(135deg,#0d2137 0%,#1a4a2e 100%);padding:20px;color:#fff}
  .listing-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:8px}
  .listing-title{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800;letter-spacing:-0.01em;margin-bottom:6px}
  .listing-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;opacity:0.85}
  .listing-body{padding:14px 16px}
  .listing-section{margin-bottom:12px}
  .listing-section-label{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-4);margin-bottom:5px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
  .listing-price{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800;color:var(--green)}
  .publish-btn{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:7px}
  .publish-btn:hover{background:#085533;transform:translateY(-1px)}

  /* TYPING INDICATOR */
  .typing-indicator{display:flex;gap:4px;align-items:center;padding:12px 15px}
  .typing-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-4);animation:tdot 1.2s infinite}
  .typing-dot:nth-child(2){animation-delay:0.2s}
  .typing-dot:nth-child(3){animation-delay:0.4s}
  @keyframes tdot{0%,80%,100%{transform:translateY(0);opacity:0.4}40%{transform:translateY(-6px);opacity:1}}

  /* QUICK REPLIES */
  .quick-replies{display:flex;flex-wrap:wrap;gap:7px;padding:4px 0 0 40px}
  .qr{font-size:12px;font-weight:600;padding:7px 14px;border:1.5px solid var(--accent);border-radius:20px;cursor:pointer;background:#fff;color:var(--accent);transition:all 0.15s}
  .qr:hover{background:var(--accent);color:#fff}

  /* INPUT BAR */
  .input-bar{background:var(--card);border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
  .input-wrap{flex:1;background:var(--bg);border:1.5px solid var(--rule);border-radius:22px;padding:9px 16px;display:flex;align-items:center;transition:border 0.15s}
  .input-wrap:focus-within{border-color:var(--accent);background:#fff}
  textarea.chat-input{flex:1;border:none;background:transparent;font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);resize:none;outline:none;max-height:100px;min-height:22px;height:22px;line-height:1.5}
  textarea.chat-input::placeholder{color:var(--ink-4)}
  .send-btn{width:38px;height:38px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;font-size:16px}
  .send-btn:hover{background:#1347c0;transform:scale(1.05)}
  .send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
</style>
</head>
<body>
<div id="agentWrap" style="display:flex;flex-direction:column;height:700px;overflow:hidden">
<div class="header">
  <div class="avatar" style="width:32px;height:32px;font-size:16px">🧭</div>
  <div>
    <div class="agent-name">Jack AI — Listing Agent</div>
    <div class="agent-status"><div class="status-dot"></div> Online</div>
  </div>
  <div class="header-right">
    <div class="logo">guide<span>sly</span></div>
    <div class="step-progress" id="stepProgress"></div>
  </div>
</div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

<div class="chat" id="chat"></div>

<div class="input-bar">
  <div class="input-wrap">
    <textarea class="chat-input" id="userInput" placeholder="Tell Jack AI about your trip or experience..." rows="1"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>
</div><!-- end agentWrap -->

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

let state = {
  phase: 'collect',
  conversationHistory: [],
  generatedListing: {},
  collectedFields: {},
  step: 0
};

// ── ACTIVITY DETECTION ────────────────────────────────────────
function detectActivity(text) {
  text = text.toLowerCase();
  if (/scuba|div(e|ing)|snorkel/.test(text)) return 'scuba';
  if (/hunt|elk|deer|duck|turkey|quail|boar|pheasant/.test(text)) return 'hunting';
  if (/cruise|boat.tour|sunset.sail|sailing|yacht/.test(text)) return 'cruise';
  if (/kayak|paddle|canoe|sup|paddleboard/.test(text)) return 'paddle';
  if (/ski|snow|snowboard|backcountry|snowshoe/.test(text)) return 'snow';
  if (/surf|wave/.test(text)) return 'surf';
  if (/hike|trail|climb|trek|backpack/.test(text)) return 'hiking';
  if (/whale|dolphin|wildlife|safari|bird/.test(text)) return 'wildlife';
  if (/fish|bass|trout|salmon|redfish|tuna|angl|fly.fish|offshore|inshore|walleye/.test(text)) return 'fishing';
  return 'general';
}

// ── SIMULATED JACK AI CONVERSATION ENGINE ─────────────────────
const QUESTIONS = {
  fishing: [
    "Great! What type of fishing do you specialise in, and which waters do you guide on?",
    "How long is a typical trip — half day, 6 hours, full day? And how many guests can you take at once?",
    "What start times do you offer? For example, 5:30 AM, 7 AM, 1 PM?",
    "What's included — rods, reels, bait, tackle? And what should guests bring themselves?",
    "Tell me about your boat — model, size, motor, any key features?",
    "What target species are you going after, and what makes your spot or technique special?",
    "What's your price range per trip?"
  ],
  scuba: [
    "What dive sites do you work with, and what certification level is required?",
    "How many dives per trip, and what's the typical max depth?",
    "How long is a full session including briefing and dives? And how many divers per trip?",
    "What start times do you offer?",
    "What equipment is included — BCD, regulator, wetsuit, tanks?",
    "What makes your dive experience stand out?",
    "What's your pricing — per person or per group?"
  ],
  hunting: [
    "What game species do you guide for, and what terrain do you hunt?",
    "Is it fully guided, semi-guided, or drop camp? Are licences and tags included?",
    "How long are your hunts — day hunts or multi-day? What's the season window?",
    "How many hunters per trip? Any accommodation included?",
    "What equipment do hunters need to bring?",
    "What's your success rate, and what makes your operation stand out?",
    "What's your pricing structure?"
  ],
  cruise: [
    "What type of vessel do you operate, and what's the itinerary or route?",
    "How long is the cruise, and how many guests can you accommodate?",
    "What times do you run — sunset, morning, midday?",
    "What's included — food, drinks, snorkelling gear, music?",
    "What makes your cruise experience special?",
    "What's your pricing per person or per charter?"
  ],
  general: [
    "Tell me more — where do you operate, and what's the core experience you offer?",
    "How long is a typical session, and how many guests do you take?",
    "What start times do you offer?",
    "What equipment or gear do you provide?",
    "What makes your experience stand out from others?",
    "What's your pricing?"
  ]
};

function getQuestions(activity) {
  return QUESTIONS[activity] || QUESTIONS.general;
}

// ── SIMULATED GENERATION ──────────────────────────────────────
function generateTitle(info) {
  const a = info.activity || 'general';
  const loc = info.location || 'the area';
  const dur = info.duration || '';

  const titles = {
    fishing: `${dur} ${info.species || 'Trophy Bass'} Fishing on ${loc}`.trim(),
    scuba: `${dur} Scuba Diving Experience — ${loc}`.trim(),
    hunting: `Guided ${info.target || 'Elk'} Hunting — ${loc}`.trim(),
    cruise: `${info.timeOfDay || 'Sunset'} Cruise on ${loc}`.trim(),
    paddle: `Guided Kayaking Adventure — ${loc}`.trim(),
    snow: `Guided ${info.snowType || 'Backcountry'} Skiing — ${loc}`.trim(),
    hiking: `Guided Hiking & Trail Experience — ${loc}`.trim(),
    general: `Outdoor Adventure Experience — ${loc}`.trim()
  };
  return (titles[a] || titles.general).replace(/\s+/g,' ').replace(/^[\s—]+|[\s—]+$/g,'');
}

function generateDescription(info) {
  const a = info.activity || 'general';
  const loc = info.location || 'a stunning outdoor location';
  const dur = info.duration || 'a few hours';
  const guests = info.groupSize || 'small groups';
  const special = info.special || 'an unforgettable experience tailored to your skill level';

  const descs = {
    fishing: `Located on ${loc}, this guided fishing trip gives you access to some of the best waters in the region. Whether you're a first-time angler or a seasoned tournament fisherman, your guide will put you on fish using proven techniques adapted to current conditions.

On this ${dur} trip, you'll target ${info.species || 'trophy fish'} using ${info.technique || 'a range of proven techniques'}. Your guide knows every productive stretch of these waters and will tailor the approach based on season, conditions, and your experience level.

All fishing equipment is provided. This trip is open to ${guests} and all skill levels are welcome. ${special}.`,
    scuba: `Explore the underwater world of ${loc} on this guided scuba experience. Suitable for ${info.certLevel || 'certified divers'}, this trip takes you to ${info.diveSites || 'the best local dive sites'} with a maximum depth of ${info.maxDepth || '18 metres'}.

Each ${dur} session includes a full briefing, equipment check, and ${info.numDives || 'two'} dives with a certified instructor who knows these waters intimately.

All essential dive equipment is ${info.equipIncluded || 'included'}. Groups are kept small to ${guests} to ensure safety and an exceptional experience underwater.`,
    hunting: `Experience a professionally guided ${info.target || 'game'} hunt in the ${info.terrain || 'rugged backcountry'} of ${loc}. This is a ${info.guideType || 'fully guided'} hunt with an experienced local guide who knows the land, the animals, and the best approach for each season.

Hunts run ${dur} with ${guests} per group. ${info.licenceInfo || 'Hunting licences and tags are available locally — confirm requirements before booking.'}

Your guide will handle scouting, positioning, and field dressing. ${special}.`,
    cruise: `Set sail on ${loc} aboard a ${info.vessel || 'premium vessel'} for an unforgettable ${info.timeOfDay || 'scenic'} cruise. This ${dur} experience accommodates up to ${guests} and includes ${info.included || 'everything you need for a perfect time on the water'}.

Sit back, take in the scenery, and let your captain handle the rest. Whether you're celebrating a special occasion or simply enjoying a day on the water, this cruise delivers.

${special}.`,
    general: `Based in ${loc}, this guided outdoor experience offers ${dur} of expert-led adventure for groups of ${guests}. Your guide brings years of local knowledge and a genuine passion for sharing this environment with guests of all backgrounds.

All necessary equipment is provided, and the experience is fully adapted to your group's skill level and goals.

${special}.`
  };
  return descs[a] || descs.general;
}

function generatePricing(info) {
  const a = info.activity || 'general';
  const ranges = {
    fishing: 'Recommended: $400 per trip | Rationale: Comparable 6-hour guided fishing trips in this region average $350–$500 per group | Per-person option: $125 per person for groups of 3+',
    scuba: 'Recommended: $150 per person | Rationale: Similar 2-dive guided experiences in this area range from $120–$200 per person | Group rate: $500 for up to 4 divers',
    hunting: 'Recommended: $600 per day | Rationale: Fully guided hunts of this type typically range from $450–$800 per day depending on species and terrain | Multi-day discount available',
    cruise: 'Recommended: $85 per person | Rationale: Similar sunset and scenic cruises in this area range from $65–$120 per person | Private charter: $600–$900 for the full vessel',
    general: 'Recommended: $200 per person | Rationale: Comparable guided outdoor experiences in this region average $150–$300 per person | Group rates available for 4+'
  };
  return ranges[a] || ranges.general;
}

function generateCategories(info) {
  const a = info.activity || 'general';
  const cats = {
    fishing: 'Primary: Bass Fishing | Tags: Freshwater Fishing, Guided Fishing, Lake Fishing, Trophy Bass, Family Friendly, Beginner Welcome',
    scuba: 'Primary: Scuba Diving | Tags: Reef Diving, Certified Divers, Equipment Included, Marine Life, Underwater Photography, Small Groups',
    hunting: 'Primary: Guided Hunting | Tags: Big Game, Trophy Hunt, Fully Guided, Private Land, Expert Guide, Serious Hunters',
    cruise: 'Primary: Boat Tours & Cruises | Tags: Sunset Cruise, Private Charter, Scenic Tour, All Ages Welcome, Special Occasions, Drinks Included',
    paddle: 'Primary: Kayaking | Tags: Guided Paddle, Scenic Route, All Levels, Equipment Provided, Small Groups, Nature Tour',
    snow: 'Primary: Snow Sports | Tags: Backcountry Skiing, Expert Guide, Off-Piste, Equipment Available, All Levels, Mountain Adventure',
    hiking: 'Primary: Guided Hiking | Tags: Trail Hiking, Local Expert, Scenic Views, All Levels, Small Groups, Nature Experience',
    general: 'Primary: Outdoor Adventure | Tags: Expert Guide, Small Groups, All Levels Welcome, Equipment Provided, Memorable Experience, Book Online'
  };
  return cats[a] || cats.general;
}

function generateFAQs(info) {
  const a = info.activity || 'general';
  const loc = (info.location || 'the area').split(',')[0];

  const faqSets = {
    fishing: `Q: Do I need a fishing licence?
A: Yes — a valid fishing licence is required for all anglers aged 17 and over. You can purchase one online at your state's wildlife agency website or at any local tackle shop. A one-day licence typically costs $11–25.

Q: What is the cancellation policy?
A: Free cancellation up to 48 hours before your trip for a full refund. Cancellations within 48 hours receive a 50% refund or the option to reschedule. No-shows are not refundable.

Q: What should I bring?
A: Sun protection (hat, sunscreen, long sleeves), polarised sunglasses, snacks and drinks, a valid fishing licence, and comfortable non-slip shoes. All fishing equipment is provided.

Q: What if we don't catch fish?
A: Fishing always has unpredictable days — no guide can guarantee catches. Your guide will adapt to conditions and work every angle to put you on fish. Consistent results across our reviews speak to the experience.`,

    scuba: `Q: What certification do I need?
A: A minimum Open Water certification (PADI, NAUI, or equivalent) is required. Discover Scuba experiences are available for uncertified guests on some dates — ask your guide when booking.

Q: Is equipment included?
A: Yes — BCD, regulator, tanks, weights, and a wetsuit are included. You're welcome to bring your own gear. An underwater torch and dive computer are recommended.

Q: What is the cancellation policy?
A: Free cancellation up to 48 hours before your session for a full refund. Within 48 hours, a 50% refund or reschedule option applies. Weather-related cancellations are fully refunded.

Q: What should I bring?
A: Your certification card (C-card), swimwear, a towel, sun protection, and water. Underwater camera or GoPro is highly recommended — the visibility on these sites is exceptional.`,

    hunting: `Q: Are licences and tags included?
A: Licences and tags are the hunter's responsibility and must be purchased before the hunt. Your guide will confirm the exact requirements for ${loc} when you book. Some packages include tag assistance.

Q: What should I bring?
A: Your hunting licence and tags, appropriate layered clothing for the terrain and season, your chosen firearm or bow, and personal items. A detailed packing list will be provided after booking.

Q: What is the cancellation policy?
A: A 50% deposit secures your booking. Cancellations 30+ days before the hunt receive a full deposit refund. Within 30 days, deposits are non-refundable but can be applied to a future booking.

Q: What is the expected success rate?
A: Success rates vary by species, season, and conditions. Your guide will give you an honest assessment during the booking call. We focus on a quality, ethical hunt regardless of outcome.`,

    cruise: `Q: What is included in the price?
A: Pricing includes the cruise, a knowledgeable captain, and standard on-board amenities. Food, beverages, and snorkelling equipment are included in most packages — confirm at booking.

Q: Is this suitable for children and non-swimmers?
A: Yes — life jackets are provided and the cruise is designed for all ages and abilities. Non-swimmers are very welcome. Swimming or snorkelling is optional, never required.

Q: What is the cancellation policy?
A: Free cancellation up to 48 hours before departure for a full refund. Within 48 hours, a 50% refund or reschedule applies. Weather cancellations are fully refunded.

Q: What should I bring?
A: Sunscreen, sunglasses, a hat, a light layer for the return trip, and a camera. Comfortable non-slip shoes are recommended. Leave valuables at home.`,

    general: `Q: Do I need any experience or special equipment?
A: No prior experience is required. All essential equipment is provided and your guide will brief you fully before the activity. Just bring appropriate clothing and a sense of adventure.

Q: What is the cancellation policy?
A: Free cancellation up to 48 hours before your experience for a full refund. Cancellations within 48 hours receive a 50% refund or the option to reschedule. Weather cancellations are fully refunded.

Q: What should I bring?
A: Comfortable clothing appropriate for the conditions, sun protection, snacks and water, and a camera. A full equipment list will be provided when you book.

Q: Is this suitable for families and beginners?
A: Absolutely — your guide adapts the experience to your group's skill level and comfort. First-timers and families with children are very welcome.`
  };

  return faqSets[a] || faqSets.general;
}

// ── CONVERSATION LOGIC ────────────────────────────────────────
let questionIndex = 0;
let currentActivity = 'general';
let answers = [];

function getNextResponse(userText) {
  const allText = (answers.join(' ') + ' ' + userText).toLowerCase();
  currentActivity = detectActivity(allText);
  answers.push(userText);

  // Extract key fields
  if (/(\d+)\s*(hour|hr)s?/i.test(userText)) {
    state.collectedFields.duration = userText.match(/(\d+\s*(?:hour|hr)s?)/i)?.[0];
  }
  if (/(up to|max|maximum)\s*(\d+)/i.test(userText) || /(\d+)\s*(guest|people|person|angler|diver|hunter)/i.test(userText)) {
    state.collectedFields.groupSize = userText;
  }
  if (/\$\d+|\d+\s*dollar/i.test(userText)) {
    state.collectedFields.price = userText;
  }
  if (/am|pm|morning|afternoon|evening|sunrise|sunset/i.test(userText)) {
    state.collectedFields.startTimes = userText;
  }
  state.collectedFields.location = state.collectedFields.location || extractLocation(userText);

  const questions = getQuestions(currentActivity);

  // Warm acknowledgement phrases
  const acks = [
    "Got it.",
    "Perfect.",
    "Great.",
    "That's helpful.",
    "Noted.",
    "Nice.",
    "Good to know."
  ];
  const ack = acks[questionIndex % acks.length];

  if (questionIndex < questions.length) {
    const next = questions[questionIndex];
    questionIndex++;
    return `${ack} ${next}`;
  } else {
    // All questions answered
    return "READY_TO_GENERATE I have everything I need to build your listing.";
  }
}

function extractLocation(text) {
  // Simple location extraction - look for place names
  const patterns = [
    /(?:in|on|at|near)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*)/,
    /([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*),\s*[A-Z]{2}/,
    /([A-Z][a-z]+\s+(?:Lake|River|Bay|Gulf|Ocean|Keys|Fork|Creek|Mountain|Island))/i
  ];
  for (const p of patterns) {
    const m = text.match(p);
    if (m) return m[1] || m[0];
  }
  return null;
}

function buildGuideInfo() {
  return {
    activity: currentActivity,
    location: state.collectedFields.location || answers[0] || 'the area',
    duration: state.collectedFields.duration || '6 hours',
    groupSize: state.collectedFields.groupSize || 'up to 4 guests',
    price: state.collectedFields.price,
    startTimes: state.collectedFields.startTimes,
    species: answers.find(a => /bass|trout|salmon|redfish|tuna|elk|deer|walleye/i.test(a)) || '',
    vessel: answers.find(a => /boat|ranger|grady|hewes|bass boat|catamaran/i.test(a)) || '',
    special: answers[answers.length - 2] || '',
    technique: answers.find(a => /fly|spin|trolling|jigging|topwater|live bait/i.test(a)) || '',
    diveSites: answers.find(a => /reef|wall|wreck|cave|site/i.test(a)) || '',
    terrain: answers.find(a => /mountain|forest|prairie|ridge|valley|backcountry/i.test(a)) || '',
    target: answers.find(a => /elk|deer|duck|turkey|bass|trout|tuna/i.test(a)) || '',
    certLevel: answers.find(a => /open water|advanced|rescue|divemaster|padi/i.test(a)) || 'certified divers',
    timeOfDay: answers.find(a => /sunset|sunrise|morning|afternoon|evening/i.test(a)) || 'scenic'
  };
}

// ── UI HELPERS ────────────────────────────────────────────────
function scrollDown() {
  setTimeout(() => chat.scrollTop = chat.scrollHeight, 50);
}

function setProgress(pct, label) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('stepProgress').textContent = label;
}

function addAgentMessage(content, isHtml) {
  const div = document.createElement('div');
  div.className = 'msg agent';
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble">${isHtml ? content : escHtml(content)}</div>`;
  chat.appendChild(div);
  scrollDown();
}

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="avatar user-av">👤</div><div class="bubble">${escHtml(text)}</div>`;
  chat.appendChild(div);
  scrollDown();
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg agent';
  div.id = 'typing';
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
  chat.appendChild(div);
  scrollDown();
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function addQuickReplies(options) {
  document.getElementById('quickReplies')?.remove();
  const div = document.createElement('div');
  div.className = 'quick-replies';
  div.id = 'quickReplies';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qr';
    btn.textContent = opt;
    btn.onclick = () => {
      document.getElementById('quickReplies')?.remove();
      input.value = opt;
      sendMessage();
    };
    div.appendChild(btn);
  });
  chat.appendChild(div);
  scrollDown();
}

function addResultCard(icon, title, bodyHtml) {
  const div = document.createElement('div');
  div.className = 'msg agent';
  div.style.maxWidth = '95%';
  div.innerHTML = `<div class="avatar">🤖</div><div style="flex:1;min-width:0">
    <div class="result-card">
      <div class="result-card-header">${icon} ${title}</div>
      <div class="result-card-body">${bodyHtml}</div>
    </div>
  </div>`;
  chat.appendChild(div);
  scrollDown();
}

function escHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function descHtml(t) {
  // Convert paragraph breaks to <p> tags, line breaks to <br>
  return escHtml(t).split('&#10;&#10;').join('</p><p>').split('&#10;').join('<br>');
}

function fmtDesc(t) {
  // Split on actual newlines for display
  var parts = t.split('\n\n');
  return parts.map(function(p){ return escHtml(p); }).join('</p><p>');
}

// ── SEND MESSAGE ──────────────────────────────────────────────
async function sendMessage() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;

  document.getElementById('quickReplies')?.remove();
  addUserMessage(text);
  input.value = '';
  input.style.height = '22px';
  sendBtn.disabled = true;

  try {
  addTyping();
  await delay(700 + Math.random() * 400);
  removeTyping();

  if (state.phase === 'collect') {
    const reply = getNextResponse(text);

    if (reply.startsWith('READY_TO_GENERATE')) {
      const msg = reply.replace('READY_TO_GENERATE', '').trim();
      if (msg) addAgentMessage(msg);
      state.phase = 'confirm';
      setProgress(30, 'Info collected');
      await delay(400);
      addAgentMessage("I have everything I need. Ready to generate your complete listing — title, description, pricing, categories, FAQs, and a quality check. Want me to go ahead? 🚀");
      addQuickReplies(["Yes, generate my listing!", "Let me add more details first"]);
    } else {
      addAgentMessage(reply);
      // Contextual quick replies
      const qrs = getContextualReplies(questionIndex - 1, currentActivity);
      if (qrs.length) addQuickReplies(qrs);
    }

  } else if (state.phase === 'confirm') {
    if (/yes|go|generate|sure|ok/i.test(text)) {
      addAgentMessage("Let's go! Running Jack AI across all 8 steps... ⚡");
      state.phase = 'generate';
      await delay(400);
      runGeneration();
    } else {
      state.phase = 'collect';
      addAgentMessage("No problem — what else would you like to add?");
    }

  } else if (state.phase === 'preview') {
    if (/publish|yes|live|go/i.test(text)) {
      publishListing();
    } else if (/change|edit|update|adjust/i.test(text)) {
      addAgentMessage("Of course — what would you like to change? Tell me and I'll update it.");
      state.phase = 'collect';
    } else {
      addAgentMessage("Your listing is ready to publish. Would you like to go live?");
      addQuickReplies(["🚀 Publish now!", "Make a change"]);
    }
  }

  } catch(err) {
    removeTyping();
    console.error('Agent error:', err);
    addAgentMessage("Sorry, something went wrong. Please refresh and try again.");
  }
  sendBtn.disabled = false;
}

// ── GENERATION ────────────────────────────────────────────────
async function runGeneration() {
  const info = buildGuideInfo();

  setProgress(35, 'Step 2/8 — Title');
  addAgentMessage("**Step 2 — Generating trip title...**", true);
  addTyping();
  await delay(800);
  removeTyping();
  const title = generateTitle(info);
  state.generatedListing.title = title;
  addResultCard('✍️', 'Trip Title', `<strong>${escHtml(title)}</strong>`);
  setProgress(45, 'Step 3/8 — Description');

  await delay(500);

  addAgentMessage("**Step 3 — Writing trip description...**", true);
  addTyping();
  await delay(1000);
  removeTyping();
  const desc = generateDescription(info);
  state.generatedListing.desc = desc;
  addResultCard('📝', 'Trip Description', escHtml(desc).split('\n\n').join('</p><p>').split('\n').join('<br>'));

  setProgress(55, 'Step 4/8 — Pricing');

  await delay(500);

  addAgentMessage("**Step 4 — Analysing market pricing...**", true);
  addTyping();
  await delay(800);
  removeTyping();
  const pricing = generatePricing(info);
  state.generatedListing.pricing = pricing;
  addResultCard('💰', 'Pricing Recommendation', escHtml(pricing).replace(/\|/g,'<br>'));
  setProgress(62, 'Step 5/8 — Categories');

  await delay(500);

  addAgentMessage("**Step 5 — Setting categories and tags...**", true);
  addTyping();
  await delay(700);
  removeTyping();
  const tags = generateCategories(info);
  state.generatedListing.tags = tags;
  const tagParts = tags.split('|').map(s => s.trim());
  const tagChips = (tagParts[1] || tags).replace('Tags:','').split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('');
  addResultCard('🏷️', 'Categories & Tags', `<strong>${tagParts[0] || ''}</strong><div class="tag-row">${tagChips}</div>`);
  setProgress(72, 'Step 6/8 — FAQs');

  await delay(500);

  addAgentMessage("**Step 6 — Generating FAQs...**", true);
  addTyping();
  await delay(900);
  removeTyping();
  const faqs = generateFAQs(info);
  state.generatedListing.faqs = faqs;
  const faqLines = faqs.split('\n');
  let faqHtml = '';
  for (let i = 0; i < faqLines.length; i++) {
    if (faqLines[i].startsWith('Q:')) {
      const q = faqLines[i].replace('Q:','').trim();
      const a = (faqLines[i+1]||'').replace('A:','').trim();
      faqHtml += `<div class="faq-item"><div class="faq-q">${escHtml(q)}</div><div class="faq-a">${escHtml(a)}</div></div>`;
      i++;
    }
  }
  addResultCard('❓', 'FAQs (4 Generated)', faqHtml);
  setProgress(82, 'Step 7/8 — Validation');

  await delay(500);

  addAgentMessage("**Step 7 — Running quality checks...**", true);
  await delay(900);
  const valHtml = `
    <div class="val-row"><span>✅</span><span>Title is ${title.length} characters — good length for SEO</span></div>
    <div class="val-row"><span>✅</span><span>Description is ${desc.split(' ').length} words — above minimum threshold</span></div>
    <div class="val-row"><span>✅</span><span>4 FAQs generated — licence, cancellation, and trip-specific questions covered</span></div>
    <div class="val-row"><span>✅</span><span>Categories and tags set — improves search ranking</span></div>
    <div class="val-row"><span>⚠️</span><span>Photos not yet uploaded — strongly recommended before publish</span></div>
  `;
  addResultCard('🔍', 'Quality Validation', valHtml);
  setProgress(92, 'Step 8/8 — Preview');

  await delay(500);

  addAgentMessage("**Step 8 — Building listing preview...**", true);
  await delay(700);

  const priceMatch = pricing.match(/\$[\d,]+/);
  const priceDisplay = priceMatch ? priceMatch[0] : '$—';
  const tagChipsPreview = (tags.split('|')[1] || '').replace('Tags:','').split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('');

  let faqPreviewHtml = '';
  const faqLines2 = faqs.split('\n');
  for (let i = 0; i < faqLines2.length; i++) {
    if (faqLines2[i].startsWith('Q:')) {
      const q = faqLines2[i].replace('Q:','').trim();
      const a = (faqLines2[i+1]||'').replace('A:','').trim();
      faqPreviewHtml += `<div class="faq-item"><div class="faq-q">${escHtml(q)}</div><div class="faq-a">${escHtml(a)}</div></div>`;
      i++;
    }
  }

  const previewDiv = document.createElement('div');
  previewDiv.className = 'msg agent';
  previewDiv.style.maxWidth = '95%';
  previewDiv.innerHTML = `<div class="avatar">🤖</div><div style="flex:1;min-width:0">
    <div class="listing-preview">
      <div class="listing-hero">
        <div class="listing-badge">✨ Jack AI Generated</div>
        <div class="listing-title">${escHtml(title)}</div>
        <div class="listing-meta"><span>⭐ New listing</span><span>📍 Ready to publish</span></div>
      </div>
      <div class="listing-body">
        <div class="listing-section">
          <div class="listing-section-label">Description</div>
          <div style="font-size:13px;color:var(--ink-2);line-height:1.7">${escHtml(desc).split('\n\n').join('</div><div style="font-size:13px;color:var(--ink-2);line-height:1.7;margin-top:8px">').split('\n').join('<br>')}</div>

/g,'</div><div style="font-size:13px;color:var(--ink-2);line-height:1.7;margin-top:8px">').replace(/
/g,'<br>')}</div>
        </div>
        <div class="listing-section">
          <div class="listing-section-label">Pricing</div>
          <div class="listing-price">${priceDisplay} <span style="font-size:13px;font-weight:400;color:var(--ink-3)">per trip</span></div>
        </div>
        <div class="listing-section">
          <div class="listing-section-label">Categories & Tags</div>
          <div class="tag-row">${tagChipsPreview}</div>
        </div>
        <div class="listing-section">
          <div class="listing-section-label">FAQs</div>
          ${faqPreviewHtml}
        </div>
        <button class="publish-btn" onclick="publishListing()">🚀 Publish Trip Listing</button>
      </div>
    </div>
  </div>`;
  chat.appendChild(previewDiv);
  scrollDown();

  setProgress(100, '✓ Ready to publish');
  state.phase = 'preview';

  await delay(400);
  addAgentMessage("Your listing is ready! Review the preview above. Want to go live?");
  addQuickReplies(["🚀 Publish now!", "Edit the description", "Adjust the price"]);
}

function publishListing() {
  document.querySelectorAll('.qr').forEach(b => b.style.display = 'none');
  addAgentMessage("🎉 <strong>Your trip listing is live!</strong><br><br>Your SEO-optimised trip landing page is now on Guidesly and discoverable in search results. Buyers can find it, read the description, check FAQs, and book directly.", true);
  setProgress(100, '✓ Published!');
  document.getElementById('progressFill').style.background = 'var(--green)';
  state.phase = 'done';
  setTimeout(() => {
    addAgentMessage("Want to create another listing?");
    addQuickReplies(["Yes, create another listing", "That's all for now"]);
  }, 1000);
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

input.addEventListener('input', function() {
  this.style.height = '22px';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

window.onload = () => {
  setTimeout(() => {
    addAgentMessage("Hi! I'm Jack AI, Guidesly's listing agent. Tell me about your trip or experience and I'll create a complete marketplace listing — title, description, pricing, FAQs, and everything in between. 🌊");
    setTimeout(() => {
      addAgentMessage("What type of experience do you offer, and where do you guide?");
      addQuickReplies(["🎣 Bass fishing, Lake Fork Texas", "🤿 Scuba diving, Florida Keys", "🏔️ Guided elk hunting, Colorado", "🚤 Sunset cruise, Miami"]);
    }, 800);
  }, 300);
};
