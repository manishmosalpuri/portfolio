<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack AI — Guidesly Listing Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#0d0d0d;--ink-2:#2a2a2a;--ink-3:#6b6b6b;--ink-4:#a0a0a0;
    --bg:#f5f4f0;--card:#ffffff;--rule:#e8e7e3;
    --accent:#1a56db;--accent-light:#eef3ff;
    --green:#0a6640;--green-light:#e3f5ec;
    --agent-bg:#f0f4ff;--agent-border:#d0deff;
    --user-bg:#1a56db;
    --radius:14px;--radius-sm:8px;
  }
  html,body{height:100%;overflow:hidden}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

  /* HEADER */
  .header{background:var(--card);border-bottom:1px solid var(--rule);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .logo{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:800;letter-spacing:-0.02em;color:var(--ink)}
  .logo span{color:var(--accent)}
  .agent-name{font-size:13px;font-weight:600;color:var(--ink-2)}
  .agent-status{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);font-weight:600}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .step-progress{font-size:11px;color:var(--ink-4);font-weight:500}

  /* PROGRESS BAR */
  .progress-track{height:3px;background:var(--rule);flex-shrink:0}
  .progress-fill{height:100%;background:var(--accent);transition:width 0.6s ease;width:0%}

  /* CHAT AREA */
  .chat{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .chat::-webkit-scrollbar{width:4px}
  .chat::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}

  /* MESSAGES */
  .msg{display:flex;gap:10px;align-items:flex-end;max-width:100%}
  .msg.agent{align-self:flex-start;max-width:85%}
  .msg.user{align-self:flex-end;flex-direction:row-reverse;max-width:75%}

  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-bottom:2px}
  .avatar.user-av{background:var(--ink-2)}

  .bubble{padding:11px 15px;border-radius:var(--radius);font-size:13.5px;line-height:1.65;word-wrap:break-word}
  .agent .bubble{background:var(--card);border:1px solid var(--rule);color:var(--ink-2);border-bottom-left-radius:4px}
  .user .bubble{background:var(--user-bg);color:#fff;border-bottom-right-radius:4px}

  /* SPECIAL CARDS IN CHAT */
  .result-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;margin-top:4px;width:100%}
  .result-card-header{padding:10px 14px;background:var(--agent-bg);border-bottom:1px solid var(--agent-border);display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent)}
  .result-card-body{padding:13px 15px;font-size:13px;color:var(--ink-2);line-height:1.7}
  .result-card-body strong{color:var(--ink);font-weight:600}

  .tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--accent-light);color:var(--accent)}

  .faq-item{padding:8px 0;border-bottom:1px solid var(--rule)}
  .faq-item:last-child{border-bottom:none}
  .faq-q{font-weight:600;color:var(--ink);font-size:13px;margin-bottom:3px}
  .faq-a{color:var(--ink-3);font-size:12.5px;line-height:1.55}

  .val-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
  .val-row:last-child{border-bottom:none}

  /* PREVIEW LISTING */
  .listing-preview{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
  .listing-hero{background:linear-gradient(135deg,#0d2137 0%,#1a4a2e 100%);padding:20px;color:#fff}
  .listing-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:8px}
  .listing-title{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800;letter-spacing:-0.01em;margin-bottom:6px}
  .listing-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;opacity:0.85}
  .listing-body{padding:14px 16px}
  .listing-section{margin-bottom:12px}
  .listing-section-label{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-4);margin-bottom:5px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
  .listing-price{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800;color:var(--green)}
  .publish-btn{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:7px}
  .publish-btn:hover{background:#085533;transform:translateY(-1px)}

  /* TYPING INDICATOR */
  .typing-indicator{display:flex;gap:4px;align-items:center;padding:12px 15px}
  .typing-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-4);animation:tdot 1.2s infinite}
  .typing-dot:nth-child(2){animation-delay:0.2s}
  .typing-dot:nth-child(3){animation-delay:0.4s}
  @keyframes tdot{0%,80%,100%{transform:translateY(0);opacity:0.4}40%{transform:translateY(-6px);opacity:1}}

  /* QUICK REPLIES */
  .quick-replies{display:flex;flex-wrap:wrap;gap:7px;padding:4px 0 0 40px}
  .qr{font-size:12px;font-weight:600;padding:7px 14px;border:1.5px solid var(--accent);border-radius:20px;cursor:pointer;background:#fff;color:var(--accent);transition:all 0.15s}
  .qr:hover{background:var(--accent);color:#fff}

  /* INPUT BAR */
  .input-bar{background:var(--card);border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
  .input-wrap{flex:1;background:var(--bg);border:1.5px solid var(--rule);border-radius:22px;padding:9px 16px;display:flex;align-items:center;transition:border 0.15s}
  .input-wrap:focus-within{border-color:var(--accent);background:#fff}
  textarea.chat-input{flex:1;border:none;background:transparent;font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);resize:none;outline:none;max-height:100px;min-height:22px;height:22px;line-height:1.5}
  textarea.chat-input::placeholder{color:var(--ink-4)}
  .send-btn{width:38px;height:38px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;font-size:16px}
  .send-btn:hover{background:#1347c0;transform:scale(1.05)}
  .send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
</style>
</head>
<body>

<div class="header">
  <div class="avatar" style="width:32px;height:32px;font-size:16px">🧭</div>
  <div>
    <div class="agent-name">Jack AI — Listing Agent</div>
    <div class="agent-status"><div class="status-dot"></div> Online</div>
  </div>
  <div class="header-right">
    <div class="logo">guide<span>sly</span></div>
    <div class="step-progress" id="stepProgress"></div>
  </div>
</div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

<div class="chat" id="chat"></div>

<div class="input-bar">
  <div class="input-wrap">
    <textarea class="chat-input" id="userInput" placeholder="Tell Jack AI about your trip or experience..." rows="1"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

let state = {
  phase: 'collect', // collect | generate | preview | done
  collectedInfo: {},
  conversationHistory: [],
  generatedListing: {},
  step: 0
};

const SYSTEM_PROMPT = `You are Jack AI, Guidesly's conversational listing agent. Guidesly is an adventure experiences marketplace. Guides offer all types of outdoor trips — fishing (most common), scuba diving, snorkelling, boat cruises, hunting, kayaking, paddleboarding, whale watching, snow sports (skiing, snowboarding, snowshoeing), hiking, rock climbing, surfing, and more.

Your job is to help ANY type of guide create a complete marketplace listing through natural conversation — no forms, no dropdowns.

PHASE 1 — COLLECT INFORMATION:
Have a natural conversation to gather the key details for their specific activity type:
- ALL trips need: activity type, location, duration, group size, equipment/gear provided, price range, what makes this guide/experience special
- FISHING: target species, waters/fishery, boat details, technique (fly, spin, offshore, inshore, ice)
- SCUBA/SNORKELLING: dive sites, certification level required, max depth, equipment rental included, number of dives
- HUNTING: game species, terrain/habitat, guided or semi-guided, licenses/tags included, season dates
- WATER SPORTS (kayak, surf, paddleboard): skill level required, water conditions, lesson or tour format
- CRUISES/BOAT TOURS: vessel type, itinerary/stops, what's included (food, drinks, snorkelling gear)
- SNOW SPORTS: mountain/terrain, skill level, lift tickets included, equipment rental
- HIKING/CLIMBING: trail/route, difficulty, elevation, technical gear required

Ask one or two questions at a time — keep it conversational. Use domain knowledge to ask smart follow-ups relevant to their activity type.

When you have enough information (all key fields covered for their activity), say EXACTLY: "READY_TO_GENERATE" on its own line, then continue with a brief message.

IMPORTANT RULES:
- Ask naturally, like a colleague helping them fill this out
- Adapt your questions entirely to the activity type — don't ask a ski guide about fish species
- Reference what they told you to show you're listening
- Keep responses SHORT — 2-3 sentences max
- Never list all questions at once
- Be warm, encouraging, and specific to their activity`;

async function callClaude(userMessage, systemOverride) {
  state.conversationHistory.push({ role: 'user', content: userMessage });
  
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: systemOverride || SYSTEM_PROMPT,
      messages: state.conversationHistory
    })
  });
  const data = await response.json();
  const reply = data.content?.[0]?.text || '';
  state.conversationHistory.push({ role: 'assistant', content: reply });
  return reply;
}

async function generateListingPart(prompt) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: 'You are Jack AI, Guidesly\'s custom LLM trained on fishing guide listings and marketplace data. Generate highly specific, conversion-optimised content. Be specific to the location, species, and guide details. Return ONLY the requested content, no preamble.',
      messages: [{ role: 'user', content: prompt }]
    })
  });
  const data = await response.json();
  return data.content?.[0]?.text || '';
}

function scrollDown() {
  setTimeout(() => chat.scrollTop = chat.scrollHeight, 50);
}

function setProgress(pct, label) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('stepProgress').textContent = label;
}

function addAgentMessage(content, isHtml) {
  const div = document.createElement('div');
  div.className = 'msg agent';
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble">${isHtml ? content : escHtml(content)}</div>`;
  chat.appendChild(div);
  scrollDown();
  return div;
}

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="avatar user-av">👤</div><div class="bubble">${escHtml(text)}</div>`;
  chat.appendChild(div);
  scrollDown();
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg agent';
  div.id = 'typing';
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
  chat.appendChild(div);
  scrollDown();
  return div;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function addQuickReplies(options) {
  const div = document.createElement('div');
  div.className = 'quick-replies';
  div.id = 'quickReplies';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qr';
    btn.textContent = opt;
    btn.onclick = () => {
      document.getElementById('quickReplies')?.remove();
      input.value = opt;
      sendMessage();
    };
    div.appendChild(btn);
  });
  chat.appendChild(div);
  scrollDown();
}

function addResultCard(icon, title, bodyHtml) {
  const div = document.createElement('div');
  div.className = 'msg agent';
  div.style.maxWidth = '95%';
  div.innerHTML = `<div class="avatar">🤖</div><div style="flex:1;min-width:0">
    <div class="result-card">
      <div class="result-card-header">${icon} ${title}</div>
      <div class="result-card-body">${bodyHtml}</div>
    </div>
  </div>`;
  chat.appendChild(div);
  scrollDown();
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  
  document.getElementById('quickReplies')?.remove();
  addUserMessage(text);
  input.value = '';
  input.style.height = '22px';
  sendBtn.disabled = true;
  
  const typing = addTyping();
  
  try {
    if (state.phase === 'collect') {
      const reply = await callClaude(text);
      removeTyping();
      
      if (reply.includes('READY_TO_GENERATE')) {
        const cleanReply = reply.replace('READY_TO_GENERATE', '').trim();
        if (cleanReply) addAgentMessage(cleanReply);
        state.phase = 'confirm';
        setProgress(30, 'Info collected');
        setTimeout(() => {
          addAgentMessage("I have everything I need. Ready to run the full 8-step agent and generate your complete listing — title, description, pricing, categories, FAQs, quality check, and a preview. Want me to go ahead? 🚀");
          addQuickReplies(["Yes, generate my listing!", "Let me add more details first"]);
        }, 400);
      } else {
        addAgentMessage(reply);
      }
    } else if (state.phase === 'confirm') {
      removeTyping();
      if (text.toLowerCase().includes('yes') || text.toLowerCase().includes('go') || text.toLowerCase().includes('generate')) {
        addAgentMessage("Let's go! Running Jack AI across all 8 steps now... ⚡");
        state.phase = 'generate';
        setTimeout(() => runGeneration(), 600);
      } else {
        state.phase = 'collect';
        const reply = await callClaude(text);
        removeTyping();
        addAgentMessage(reply);
      }
    } else if (state.phase === 'preview') {
      removeTyping();
      if (text.toLowerCase().includes('publish') || text.toLowerCase().includes('yes') || text.toLowerCase().includes('live')) {
        publishListing();
      } else if (text.toLowerCase().includes('change') || text.toLowerCase().includes('edit') || text.toLowerCase().includes('update')) {
        addAgentMessage("Of course — what would you like to change? Just tell me and I'll regenerate that section.");
        state.phase = 'collect';
      } else {
        const reply = await callClaude(text);
        removeTyping();
        addAgentMessage(reply);
      }
    }
  } catch(err) {
    removeTyping();
    addAgentMessage("Hmm, something went wrong connecting to Jack AI. Please try again.");
  }
  
  sendBtn.disabled = false;
}

async function runGeneration() {
  const context = state.conversationHistory
    .filter(m => m.role === 'user')
    .map(m => m.content)
    .join(' | ');

  setProgress(35, 'Step 2/8 — Title');

  // STEP 2: Title
  addAgentMessage("**Step 2 — Generating trip title...**", true);
  let t = addTyping();
  const title = await generateListingPart(`Based on this guide's information, generate ONE compelling, SEO-optimised trip/experience listing title. Match the activity type (fishing, scuba, hunting, cruise, snow sport, etc). Specific, searchable, max 70 chars. Return ONLY the title.\n\nGuide info: ${context}`);
  removeTyping();
  state.generatedListing.title = title;
  addResultCard('✍️', 'Trip Title', `<strong>${escHtml(title)}</strong>`);
  setProgress(45, 'Step 3/8 — Description');

  await delay(400);

  // STEP 3: Description
  addAgentMessage("**Step 3 — Writing trip description...**", true);
  t = addTyping();
  const desc = await generateListingPart(`Write a trip/experience description for this outdoor activity listing (3 structured paragraphs: Overview, What to Expect, Skill Level & Who It's For). Adapt entirely to the activity type — do not use fishing language for a scuba or hunting trip. Be specific to the location, activity details, and guide's approach. ~180 words.\n\nGuide info: ${context}`);
  removeTyping();
  state.generatedListing.desc = desc;
  addResultCard('📝', 'Trip Description', escHtml(desc).replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>'));
  setProgress(55, 'Step 4/8 — Pricing');

  await delay(400);

  // STEP 4: Pricing
  addAgentMessage("**Step 4 — Analysing market pricing...**", true);
  t = addTyping();
  const pricing = await generateListingPart(`Based on this outdoor experience's details and typical market rates for this activity type and location, suggest an optimal listing price. Consider whether this is priced per person, per group, or per day based on the activity norms. Return as: "Recommended: $[X] [per trip/per person/per day] | Rationale: [one sentence comparing to similar experiences] | Alternative: $[Y] (optional secondary pricing)"\n\nGuide info: ${context}`);
  removeTyping();
  state.generatedListing.pricing = pricing;
  addResultCard('💰', 'Pricing Recommendation', escHtml(pricing).replace(/\|/g,'<br>'));
  setProgress(62, 'Step 5/8 — Categories');

  await delay(400);

  // STEP 5: Tags
  addAgentMessage("**Step 5 — Setting categories and tags...**", true);
  t = addTyping();
  const tags = await generateListingPart(`Suggest the best marketplace categories and search tags for this outdoor experience listing. Base the category and tags on the actual activity type (e.g. Scuba Diving, Bass Fishing, Elk Hunting, Sunset Cruise, Backcountry Skiing). Tags should match how buyers search for this experience. Format exactly as: "Primary: [category] | Tags: tag1, tag2, tag3, tag4, tag5, tag6"\n\nGuide info: ${context}`);
  removeTyping();
  state.generatedListing.tags = tags;
  const tagParts = tags.split('|').map(s => s.trim());
  const tagChips = (tagParts[1] || tags).replace('Tags:','').split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('');
  addResultCard('🏷️', 'Categories & Tags', `<strong>${tagParts[0] || ''}</strong><div class="tag-row">${tagChips}</div>`);
  setProgress(72, 'Step 6/8 — FAQs');

  await delay(400);

  // STEP 6: FAQs
  addAgentMessage("**Step 6 — Generating FAQs...**", true);
  t = addTyping();
  const faqs = await generateListingPart(`Generate exactly 4 FAQs for this fishing trip. Cover: fishing licence requirements (be state-specific), cancellation policy, what to bring, and one specific question about this trip type. Format each as:\nQ: [question]\nA: [1-2 sentence answer]\n\nGuide info: ${context}`);
  removeTyping();
  state.generatedListing.faqs = faqs;

  const faqLines = faqs.split('\n');
  let faqHtml = '';
  for (let i = 0; i < faqLines.length; i++) {
    if (faqLines[i].startsWith('Q:')) {
      const q = faqLines[i].replace('Q:','').trim();
      const a = (faqLines[i+1]||'').replace('A:','').trim();
      faqHtml += `<div class="faq-item"><div class="faq-q">${escHtml(q)}</div><div class="faq-a">${escHtml(a)}</div></div>`;
      i++;
    }
  }
  addResultCard('❓', 'FAQs (4 Generated)', faqHtml || escHtml(faqs));
  setProgress(82, 'Step 7/8 — Validation');

  await delay(400);

  // STEP 7: Validation
  addAgentMessage("**Step 7 — Running quality checks...**", true);
  await delay(800);
  const valHtml = `
    <div class="val-row"><span>✅</span><span>Title is ${title.length} characters — optimal for SEO</span></div>
    <div class="val-row"><span>✅</span><span>Description is ${desc.split(' ').length} words — above minimum threshold</span></div>
    <div class="val-row"><span>✅</span><span>4 FAQs generated — licence, cancellation, and trip-specific questions covered</span></div>
    <div class="val-row"><span>✅</span><span>Categories and tags set — improves search ranking</span></div>
    <div class="val-row"><span>⚠️</span><span>Photos not yet uploaded — strongly recommended before publish</span></div>
  `;
  addResultCard('🔍', 'Quality Validation', valHtml);
  setProgress(92, 'Step 8/8 — Preview');

  await delay(400);

  // STEP 8: Full Preview
  addAgentMessage("**Step 8 — Building your listing preview...**", true);
  await delay(600);

  const priceMatch = state.generatedListing.pricing.match(/\$[\d,]+/);
  const priceDisplay = priceMatch ? priceMatch[0] : '$—';

  const tagChipsPreview = (state.generatedListing.tags.split('|')[1] || '').replace('Tags:','').split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('');

  let faqPreviewHtml = '';
  const faqLines2 = state.generatedListing.faqs.split('\n');
  for (let i = 0; i < faqLines2.length; i++) {
    if (faqLines2[i].startsWith('Q:')) {
      const q = faqLines2[i].replace('Q:','').trim();
      const a = (faqLines2[i+1]||'').replace('A:','').trim();
      faqPreviewHtml += `<div class="faq-item"><div class="faq-q">${escHtml(q)}</div><div class="faq-a">${escHtml(a)}</div></div>`;
      i++;
    }
  }

  const previewDiv = document.createElement('div');
  previewDiv.className = 'msg agent';
  previewDiv.style.maxWidth = '95%';
  previewDiv.innerHTML = `<div class="avatar">🤖</div><div style="flex:1;min-width:0">
    <div class="listing-preview">
      <div class="listing-hero">
        <div class="listing-badge">✨ Jack AI Generated</div>
        <div class="listing-title">${escHtml(title)}</div>
        <div class="listing-meta">
          <span>⭐ New listing</span>
          <span>📍 Ready to publish</span>
        </div>
      </div>
      <div class="listing-body">
        <div class="listing-section">
          <div class="listing-section-label">Description</div>
          <div style="font-size:13px;color:var(--ink-2);line-height:1.7">${escHtml(desc).replace(/\n\n/g,'</div><div style="font-size:13px;color:var(--ink-2);line-height:1.7;margin-top:8px">').replace(/\n/g,'<br>')}</div>
        </div>
        <div class="listing-section">
          <div class="listing-section-label">Pricing</div>
          <div class="listing-price">${priceDisplay} <span style="font-size:13px;font-weight:400;color:var(--ink-3)">per trip</span></div>
        </div>
        <div class="listing-section">
          <div class="listing-section-label">Categories & Tags</div>
          <div class="tag-row">${tagChipsPreview}</div>
        </div>
        <div class="listing-section">
          <div class="listing-section-label">FAQs</div>
          ${faqPreviewHtml}
        </div>
        <button class="publish-btn" onclick="publishListing()">🚀 Publish Trip Listing</button>
      </div>
    </div>
  </div>`;
  chat.appendChild(previewDiv);
  scrollDown();

  setProgress(100, '✓ Ready to publish');
  state.phase = 'preview';

  await delay(500);
  addAgentMessage("Your listing is ready! This will publish as a fully SEO-optimised trip landing page on Guidesly — discoverable in search and immediately bookable. Want to go live, or make any changes?");
  addQuickReplies(["🚀 Publish now!", "Make a change", "Edit the description", "Adjust the price"]);

  sendBtn.disabled = false;
}

function publishListing() {
  document.querySelectorAll('.qr').forEach(b => b.style.display = 'none');
  addAgentMessage("🎉 <strong>Your trip listing is live!</strong><br><br>Your SEO-optimised trip landing page is now live on Guidesly and discoverable in search results. Buyers can find it, read the full description, check FAQs, see your guide profile, and book directly.", true);
  setProgress(100, '✓ Published!');
  document.getElementById('progressFill').style.background = 'var(--green)';
  state.phase = 'done';
  setTimeout(() => {
    addAgentMessage("Want to create another trip listing?");
    addQuickReplies(["Yes, create another listing", "That's all for now"]);
  }, 1000);
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// Auto-resize textarea
input.addEventListener('input', function() {
  this.style.height = '22px';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

// Enter to send
input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// WELCOME MESSAGE
window.onload = () => {
  setTimeout(() => {
    addAgentMessage("Hi! I'm Jack AI, Guidesly's listing agent. Tell me about your trip or experience and I'll create a complete marketplace listing for you — title, description, pricing, FAQs, and everything in between. 🌊");
    setTimeout(() => {
      addAgentMessage("What type of experience do you offer, and where do you guide?");
      addQuickReplies(["🎣 Bass fishing, Lake Fork Texas", "🤿 Scuba diving, Florida Keys", "🏔️ Guided elk hunting, Colorado", "🚤 Sunset cruise, Miami"]);
    }, 800);
  }, 300);
};
</script>
</body>
</html>
